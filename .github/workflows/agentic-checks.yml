# Installed by `speckit.agentic.init`. Make `agentic-checks` a required status check on the default branch.
name: agentic-checks
on:
  pull_request:
  pull_request_review:
    types: [submitted]   # a review may carry a gate's approval line: the checks run again so that decision can be mirrored and judged
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
jobs:
  agentic-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.2
      - name: Self-test (every check fails on its broken fixture)
        run: python .specify/extensions/agentic/scripts/agentic.py selftest
      - name: Checks on a pull request
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}   # passed through the environment, never pasted into the command
        run: python .specify/extensions/agentic/scripts/agentic.py check --base-ref "origin/$BASE_REF"
      - name: Checks and drift on the default branch
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Compared with the commit before the push, so contract, version and migration changes are seen here too.
          python .specify/extensions/agentic/scripts/agentic.py check --base-ref "${{ github.event.before }}"
