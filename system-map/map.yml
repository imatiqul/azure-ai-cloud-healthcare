# System map of HealthQ Copilot, in agentic-spec-kit's format.
# Converted by examples/healthq/phase-5/convert_map.py from the Phase 1 draft, against the repository at commit 6e0879d27bb59017f34544aa60e3033cce75e31d.
# Owners, tiers and classifications are an agent's proposals from Phase 1. A person confirms them when a plan is reviewed (G3).
# `holds` keeps what Phase 1 wrote where the HIPAA pack's three classes are coarser. Not mapped: Per-route gateway targets and APIM policies; Redis and Cosmos contents and their classification; Tables and columns inside each service database (only phi_audit_logs is mapped); Infrastructure resources beyond the bicep module list; Publishers of triage.completed and escalation.required; Frontend to backend call paths; Kubernetes, Helm and Argo deployment topology
