schema_version: "1.0"

extension:
  id: "agentic-system"
  name: "Agentic Spec Kit — System"
  version: "0.2.0"
  description: "A system map of services, data stores, contracts and shared components, with discovery, impact analysis, reviewers derived from what a change touches, and change packs for data, contracts, shared components and dependencies."
  author: "Atiqul Islam"
  repository: "https://github.com/imatiqul/agentic-spec-kit"
  license: "MIT"

requires:
  speckit_version: ">=1.4.3"
  extensions:
    - id: "agentic"
      version: ">=0.1.0"

provides:
  commands:
    - name: "speckit.agentic-system.map"
      file: "commands/map.md"
      description: "Discover the system map from the code, validate it, and report drift."
    - name: "speckit.agentic-system.impact"
      file: "commands/impact.md"
      description: "Compute what a spec touches and reaches, the tier that follows, and who must approve."
    - name: "speckit.agentic-system.change"
      file: "commands/change.md"
      description: "Draft the data-change plan and rollout order a spec needs, classify its migrations, and run the change-pack checks."

hooks:
  after_plan:
    command: "speckit.agentic-system.impact"
    optional: true
    prompt: "Generate the impact report for this plan?"
    description: "Write impact.md so gate G3 has the blast radius and the required approvers"

tags:
  - "architecture"
  - "impact-analysis"
  - "dependencies"
  - "governance"
  - "migrations"
  - "contracts"
