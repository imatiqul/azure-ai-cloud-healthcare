schema_version: "1.0"

extension:
  id: "agentic-connect"
  name: "Agentic Spec Kit — Connect"
  version: "0.6.0"
  description: "Requirements in from Azure DevOps, Jira, ClickUp, GitHub and documents; the kit run by GitHub Actions, Azure Pipelines or GitLab CI; people told through Slack, Teams, email and a note on the work item. Notifications carry identifiers and links only, and never approve a gate."
  author: "Atiqul Islam"
  repository: "https://github.com/imatiqul/agentic-spec-kit"
  license: "MIT"

requires:
  speckit_version: ">=1.4.3"
  extensions:
    - id: "agentic"
      version: ">=0.1.0"
    - id: "agentic-product"
      version: ">=0.5.0"

provides:
  commands:
    - name: "speckit.agentic-connect.connect"
      file: "commands/connect.md"
      description: "Set up connections to trackers and notification channels, and install the pipeline for this repository's CI system."

tags:
  - "ci-cd"
  - "jira"
  - "azure-devops"
  - "clickup"
  - "github"
  - "slack"
  - "teams"
  - "notifications"
