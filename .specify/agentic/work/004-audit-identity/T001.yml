findings:
- round: 1
  by: security-reviewer
  text: S-8 and the T001 part of S-4 of reviews/G5-security.md. ResolveUserId checks one identity for authentication and reads
    the subject from any. The lines the middleware writes after the pipeline carry no user of their own; the line for a failed
    write also lacks the method, the status and the correlation id. The reviewer first wrote accept, and returned the item
    when told that an accepted item cannot be changed again in this change.
