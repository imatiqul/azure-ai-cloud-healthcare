- round: 1
  by: independent-verifier
  text: V-5 of verification/G6-report.md. The order rows and the census are separate lists, so a service added to one and
    not the other is not checked for order. The census sees only the exact registration line. Nothing in front of authentication
    is examined. A block comment, a preprocessor condition, dead code, a branch that answers a request and a second registration
    all pass. The sentence about the census in evidence/T004-order-tests.md is wrong.
