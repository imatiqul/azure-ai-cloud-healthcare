title: Stop tracking the Playwright report (spec 020, FR-002)
body: '`frontend/playwright-report/index.html` is tracked, although `.gitignore` ignores
  `frontend/playwright-report/`. Spec 020 (repository hygiene) says in FR-002 that
  test reports must not be tracked. This issue asks for that one requirement to be
  delivered on its own. It is also the first live test of agentic-spec-kit on this
  repository: the kit reads this issue and its discussion as the request behind a
  change, and the change goes through the kit''s gates in pull requests.'
