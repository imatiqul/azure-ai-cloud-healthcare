installed:
- agentic
- agentic-connect
- agentic-hipaa
- agentic-product
- agentic-quality
- agentic-system
- agentic-team
settings:
  auto_execute_hooks: true
hooks:
  after_plan:
  - extension: agentic-system
    command: speckit.agentic-system.impact
    enabled: true
    optional: true
    priority: 10
    prompt: Generate the impact report for this plan?
    description: Write impact.md so gate G3 has the blast radius and the required
      approvers
    condition: null
  - extension: agentic-quality
    command: speckit.agentic-quality.quality
    enabled: true
    optional: true
    priority: 10
    prompt: Scaffold the quality files this plan needs?
    description: Write the threat model, test strategy and any privacy, AI or infrastructure
      records gate G3 will ask for
    condition: null
  after_tasks:
  - extension: agentic
    command: speckit.agentic.trace
    enabled: true
    optional: true
    priority: 10
    prompt: Build the trace manifest for these tasks?
    description: Generate trace-manifest.json so gate G4 has its evidence
    condition: null
  before_implement:
  - extension: agentic
    command: speckit.agentic.check
    enabled: true
    optional: false
    priority: 10
    prompt: Execute speckit.agentic.check?
    description: Run the kit's checks before implementation starts
    condition: null
  after_specify:
  - extension: agentic-product
    command: speckit.agentic-product.shape
    enabled: true
    optional: true
    priority: 10
    prompt: Check this spec for duplicates and draft its behaviour delta?
    description: Link the request, list likely duplicates for the Product Owner, lint
      the wording and draft the delta gate G1 will review
    condition: null
